// TenantSignInService is what a sign-in asks of the tenants. Callers:
// login-ui and sso-service. gRPC only: no HTTP mapping, so no gateway route
// exposes it.
service TenantSignInService {
  // ListSignInTenants returns the tenants an address may sign in to: those
  // its account is a member of, those that invited it and those it could
  // auto-join, even when the address has no account.
  rpc ListSignInTenants(ListSignInTenantsRequest) returns (ListSignInTenantsResponse) {}

  // GetSignInContext answers, for one tenant and an address (before sign-in)
  // or an account, what a sign-in into that tenant needs: membership,
  // enforcement, the active bindings that apply to the address, whether
  // an invitation or auto-join admits it, the MFA requirement, and whether
  // the address has an account.
  rpc GetSignInContext(GetSignInContextRequest) returns (GetSignInContextResponse) {}

  // JoinTenant makes the account a member of the tenant, when the tenant
  // admits the account's address by a pending invitation (which this spends)
  // or by auto-join; otherwise NOT_ADMITTED. An account that is a member
  // already is success. For login-ui, when it accepts a sign-in to the tenant.
  rpc JoinTenant(JoinTenantRequest) returns (JoinTenantResponse) {}

  // CreatePersonalTenant creates the account's personal tenant, enabled, with
  // the account as its owner. A repeat call returns the existing one. An
  // account that belongs to a tenant, or has a pending invitation to one,
  // gets none: HAS_TENANT.
  rpc CreatePersonalTenant(CreatePersonalTenantRequest) returns (CreatePersonalTenantResponse) {}
}

// TenantSSOPolicyService is for sso-service, which checks what only it knows
// before it writes: a binding names a connection the tenant owns, and an
// active one a tested connection. Each write changes one part of the policy;
// the rules of the policy as a whole (REQUIRED needs an active binding,
// auto-join needs REQUIRED and domains) are checked here, against what is
// stored, in the transaction that writes it. No caller reads the policy to
// write it back. gRPC only: no HTTP mapping, so no gateway route leads around
// those checks.
service TenantSSOPolicyService {
  rpc GetTenantSSOPolicy(GetTenantSSOPolicyRequest) returns (GetTenantSSOPolicyResponse) {}

  // PutTenantSSOPolicy: enforcement, auto-join and the bindings.
  rpc PutTenantSSOPolicy(PutTenantSSOPolicyRequest) returns (PutTenantSSOPolicyResponse) {}

  // SetTenantSSODomains: the domains.
  rpc SetTenantSSODomains(SetTenantSSODomainsRequest) returns (SetTenantSSODomainsResponse) {}

  // RemoveTenantSSOBinding: one binding, when its connection is deleted. A
  // connection the policy does not bind changes nothing.
  rpc RemoveTenantSSOBinding(RemoveTenantSSOBindingRequest) returns (RemoveTenantSSOBindingResponse) {}
}
