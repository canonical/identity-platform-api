// Errors. A refusal that a client may branch on carries a reason: over gRPC a
// google.rpc.ErrorInfo detail (domain "tenant-service"), over HTTP the
// message begins with "<REASON>: ". The reasons, with their status codes:
//   PERSONAL_TENANT (FAILED_PRECONDITION): InviteMember, ProvisionUser and
//     RemoveTenantUser on a personal tenant; the SSO-policy RPCs on one.
//   DOMAIN_NOT_ALLOWED (INVALID_ARGUMENT): InviteMember, an address outside
//     the domains of a tenant that requires company sign-in.
//   NOT_ADMITTED (FAILED_PRECONDITION): JoinTenant.
//   HAS_TENANT (FAILED_PRECONDITION): CreatePersonalTenant.
//   REQUIRED_NEEDS_ACTIVE_BINDING, AUTO_JOIN_NEEDS_REQUIRED_AND_DOMAINS
//     (FAILED_PRECONDITION): the SSO-policy writes.

