// SSOSignInService is called by login-ui while a person signs in. gRPC only
// (no HTTP mapping): no person may call it, so no gateway route exposes it.
//
// Errors are gRPC status codes with a google.rpc.ErrorInfo (domain
// "sso-service") whose reason is one of: NOT_APPLICABLE
// (FAILED_PRECONDITION), LAST_CREDENTIAL (FAILED_PRECONDITION).
service SSOSignInService {
  // ListOptions returns the connections among connection_ids that exist and
  // are TESTED. No remote calls.
  rpc ListOptions(ListOptionsRequest) returns (ListOptionsResponse) {}

  // StartAttempt seals a sign-in attempt into its ticket (nothing is
  // stored); refuses a connection that is not TESTED (NOT_APPLICABLE). No
  // remote calls.
  rpc StartAttempt(StartAttemptRequest) returns (StartAttemptResponse) {}

  // CompleteAttempt confirms that the attempt ended at this account, in the
  // browser that presents it: the ticket is unexpired, the account has the
  // ticket's address and holds a link to the ticket's connection
  // (byo-sso:<connection_id>:<subject>), read from Kratos, which wrote it
  // (registration, account linking, or earlier), and the receipt is the one
  // sso-service gave the browser when the identity provider answered for
  // this ticket as that subject. Nothing is stored or written: a repeat
  // returns the same answer; an expired ticket, another account or no such
  // receipt, NOT_APPLICABLE.
  rpc CompleteAttempt(CompleteAttemptRequest) returns (CompleteAttemptResponse) {}

  // ListLinks reads the account's byo-sso identifiers from Kratos; those of
  // deleted connections are ignored.
  rpc ListLinks(ListLinksRequest) returns (ListLinksResponse) {}

  // DeleteLink removes one link; refused (LAST_CREDENTIAL) unless the account
  // keeps another way to sign in of its own.
  rpc DeleteLink(DeleteLinkRequest) returns (DeleteLinkResponse) {}
}

// SSOTenantAdminService is what a tenant's admins manage: the tenant's
// connections, their test sign-ins and its SSO policy. Every route names its
// tenant in the path, and the gateway in front of sso-service authorizes the
// caller for that tenant; sso-service checks no roles, only that the
// resource belongs to that tenant (NOT_FOUND, CONNECTION_NOT_FOUND,
// otherwise).
//
// A refusal that a client may branch on carries a reason: over gRPC a
// google.rpc.ErrorInfo detail (domain "sso-service"), over HTTP the message
// begins with "<REASON>: ". The reasons, with their status codes:
//   CONNECTION_NOT_FOUND (NOT_FOUND): every RPC that names a connection.
//   CONNECTION_LIMIT (FAILED_PRECONDITION): CreateConnection.
//   PERSONAL_TENANT (FAILED_PRECONDITION): CreateConnection and the policy
//     RPCs, for a personal tenant.
//   IDP_CHECK_FAILED (FAILED_PRECONDITION): StartTestLogin, when the
//     identity provider cannot be used as the connection describes it.
//   CONNECTION_NOT_TESTED (FAILED_PRECONDITION): PutTenantSSOPolicy, an active
//     binding to a connection that is not TESTED.
//   REQUIRED_NEEDS_ACTIVE_BINDING, AUTO_JOIN_NEEDS_REQUIRED_AND_DOMAINS
//     (FAILED_PRECONDITION): PutTenantSSOPolicy and DeleteConnection.
service SSOTenantAdminService {
  // ListConnections: the connections the tenant owns.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse) {
    option (google.api.http) = {
      get: "/api/v0/sso/tenants/{tenant_id}/connections"
    };

    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List a tenant's connections";
      responses: {
        key: "200",
        value: {
          schema: {
            json_schema: {
              ref: ".identity.platform.api.sso.ListConnectionsResponse"
            }
          }
        }
      };
      responses: {
        key: "400",
        value: {
          schema: {
            json_schema: {
              ref: ".identity.platform.api.types.ErrorResponse"
            }
          }
          description: "Bad request";
        }
      };
      responses: {
        key: "401",
        value: {
          schema: {
            json_schema: {
              ref: ".identity.platform.api.types.ErrorResponse"
            }
          }
          description: "Unauthorized";
        }
      };
      responses: {
        key: "403",
        value: {
          schema: {
            json_schema: {
              ref: ".identity.platform.api.types.ErrorResponse"
            }
          }
          description: "Forbidden";
        }
      };
      responses: {
        key: "default",
        value: {
          schema: {
            json_schema: {
              ref: ".identity.platform.api.types.ErrorResponse"
            }
          }
          description: "Internal server error";
        }
      };
    };
  }

